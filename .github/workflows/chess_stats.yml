name: ♟️ Update Chess Stats Image

on:
  schedule:
    - cron: "0 0 * * *"  # Runs every day at midnight UTC
  workflow_dispatch:     # Allows you to trigger manually from GitHub UI

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: 📦 Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: 🧠 Run Script to Generate Chess Stats
        run: python generate_chess_stats.py

      - name: 🚀 Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add chess_stats.png
          git commit -m "♟️ Auto-update chess stats image" || echo "No changes to commit"
          git push
